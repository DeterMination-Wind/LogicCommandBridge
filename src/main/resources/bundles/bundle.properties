logiccmd.sent.attack = [accent]Attack[]: {0} unit(s) across {1} processor(s).
logiccmd.sent.latency = [lightgray]First order needs about {0}s on this processor.[]
logiccmd.preview.empty = No mlog generated yet.
logiccmd.preview.title = Last generated mlog

