settings.logiccmd = Logic Command Bridge
category.logiccmd.name = Logic Command Bridge

keybind.logiccmd-bind.name = LCB: bind processor / command bridge
keybind.logiccmd-release.name = LCB: clear current formation
keybind.logiccmd-unbind.name = LCB: release formation from logic control
keybind.logiccmd-preview.name = LCB: show last generated mlog
keybind.logiccmd-prev-group.name = LCB: previous formation
keybind.logiccmd-next-group.name = LCB: next formation

setting.logiccmd-processor-type.name = Processor type
setting.logiccmd-processor-type.description = Processor laid out by a drag. World processors require editor mode or allowEditWorldProcessors.
setting.logiccmd-auto-build.name = Auto-build missing processors
setting.logiccmd-auto-build.description = Place the processor automatically when the dragged cells are empty.
setting.logiccmd-hold.name = Keep the order until arrival
setting.logiccmd-hold.description = Re-issue the order every few seconds so long moves do not time out.
setting.logiccmd-hold-wait.name = Hold refresh interval
setting.logiccmd-hold-cycles.name = Hold timeout
setting.logiccmd-max-units.name = Max units per order
setting.logiccmd-max-processors.name = Max processors per drag
setting.logiccmd-spacing.name = Formation spacing
setting.logiccmd-mp-tolerance.name = Multiplayer position match tolerance
setting.logiccmd-mp-tolerance.description = How far a synced position may drift before matching fails. Raise it on high-latency servers.
setting.logiccmd-mp-pad.name = Multiplayer prefilter padding
setting.logiccmd-mp-flag-cleanup.name = Clear stale group flags
setting.logiccmd-mp-flag-cleanup.description = Wipe old flag tokens before matching a new group.
setting.logiccmd-mp-flag-reuse.name = Reuse group flags between orders
setting.logiccmd-mp-flag-reuse.description = Skip re-matching when the formation has not changed.
setting.logiccmd-formation-crowd.name = Crowd the target instead of a grid
setting.logiccmd-attack-move.name = Attack while moving
setting.logiccmd-attack-move.description = Auto-acquire the nearest enemy unit; buildings need an explicit attack order.
setting.logiccmd-pathfind.name = Use pathfinding
setting.logiccmd-pathfind.description = Route around terrain instead of moving in a straight line.
setting.logiccmd-swallow.name = Always consume the vanilla command click
setting.logiccmd-hints.name = Show hints
setting.logiccmd-debug.name = Log command details

