logiccmd.no.selection = [scarlet]没有可指挥的编队[]。先框选单位，再右键。
logiccmd.sent.move = [accent]移动[]：{0} 个单位，分工到 {1} 台处理器。
logiccmd.sent.attack = [accent]攻击[]：{0} 个单位，分工到 {1} 台处理器。
logiccmd.sent.latency = [lightgray]当前处理器下，首条指令约需 {0} 秒。[]
logiccmd.preview.empty = 还没有生成过 mlog。
logiccmd.preview.title = 上次生成的 mlog

