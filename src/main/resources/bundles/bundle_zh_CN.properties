setting.logiccmd-processor-type.name = 处理器类型
setting.logiccmd-processor-type.description = 拖框后使用的处理器。世界处理器需要编辑器或允许编辑世界处理器。
setting.logiccmd-auto-build.name = 没有处理器时自动建造
setting.logiccmd-auto-build.description = 拖框的格子上为空时自动放置处理器。
setting.logiccmd-hold.name = 指令保持到抵达
setting.logiccmd-hold.description = 每隔几秒重发一次指令，避免长途移动因 10 秒超时中断。
setting.logiccmd-hold-wait.name = 保持刷新间隔
setting.logiccmd-hold-cycles.name = 保持超时轮数
setting.logiccmd-max-units.name = 单次指令最大单位数
setting.logiccmd-max-processors.name = 单次拖框最多铺几台处理器
setting.logiccmd-spacing.name = 编队间距
setting.logiccmd-mp-tolerance.name = 多人位置匹配容差
setting.logiccmd-mp-tolerance.description = 同步坐标漂移超过该值就会匹配失败；高延迟服务器可以调大。
setting.logiccmd-mp-pad.name = 多人预筛外扩
setting.logiccmd-mp-flag-cleanup.name = 换编队时清理旧标记
setting.logiccmd-mp-flag-cleanup.description = 匹配新编队前清除旧的 flag 标记。
setting.logiccmd-mp-flag-reuse.name = 连续指令复用编队标记
setting.logiccmd-mp-flag-reuse.description = 编队没有变化时跳过重新匹配。
setting.logiccmd-formation-crowd.name = 到达后挤在目标点
setting.logiccmd-attack-move.name = 移动时自动攻击
setting.logiccmd-attack-move.description = 自动索敌最近的敌方单位；建筑需要右键指定攻击。
setting.logiccmd-pathfind.name = 使用寻路移动
setting.logiccmd-pathfind.description = 绕开地形而不是走直线。
setting.logiccmd-swallow.name = 始终吞掉原版控兵点击
setting.logiccmd-hints.name = 显示提示
setting.logiccmd-debug.name = 控制台输出指令详情

