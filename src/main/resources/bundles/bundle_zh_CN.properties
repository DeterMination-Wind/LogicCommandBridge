logiccmd.pick.start = [accent]按住左键拖出一个矩形[]，自动铺处理器；右键取消。
logiccmd.pick.placed = [accent]已绑定 {0} 台处理器[]（跳过 {1} 台）。框选单位后右键下达指令。
